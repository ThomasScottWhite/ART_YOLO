task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ["bbox"]

num_classes: 80
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/thomas/Documents/ART_YOLO/dataset/dfine_coco/train/
    ann_file: /home/thomas/Documents/ART_YOLO/dataset/dfine_coco/train_annotations.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/thomas/Documents/ART_YOLO/dataset/dfine_coco/val/
    ann_file: /home/thomas/Documents/ART_YOLO/dataset/dfine_coco/val_annotations.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
